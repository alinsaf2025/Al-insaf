        hint.textContent=!mo.value.trim()?(blank?'মাস নির্দিষ্ট নেই':''):!k?'মাস বুঝতে পারছি না, যেমন লিখুন: মার্চ ২০২৫':'→ '+mlabel(k)+(r&&r.due?(r.state=='paid'?' — জমা ✓':' — বাকি '+tk(r.rem)):'')};
      const sync=()=>{upd();if(touched)return;const r=rowOf(pm(mo.value));am.value=r&&r.rem?r.rem:''};
      const fill=()=>{const mm=mem(sm.value),rows=mm?mrows(mm):[];let k;
        if(pref)k=pref;else if(blank)k='';else{const u=rows.find(r=>r.rem>0);k=u?u.k:curM()}
        mo.value=k?mlabel(k):'';sync()};
      sm.onchange=()=>{pref='';fill()};mo.oninput=sync;am.oninput=()=>{touched=true};fill()})}
